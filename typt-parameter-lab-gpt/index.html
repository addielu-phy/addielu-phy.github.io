const bytes = str => Uint8Array.from(atob(str), x => x.charCodeAt(0));
const form=document.getElementById('unlock-form'), pass=document.getElementById('pass'), visibility=document.getElementById('visibility');
const status=document.getElementById('status'), panel=document.getElementById('lock-panel'), research=document.getElementById('research'), nav=document.getElementById('section-nav');
visibility.addEventListener('click',()=>{const show=pass.type==='password';pass.type=show?'text':'password';visibility.textContent=show?'隱藏':'顯示';visibility.setAttribute('aria-pressed',String(show));pass.focus()});
function lock(){research.replaceChildren();nav.replaceChildren();research.hidden=true;nav.hidden=true;panel.hidden=false;pass.value='';pass.type='password';visibility.textContent='顯示';visibility.setAttribute('aria-pressed','false');status.textContent='教材已鎖定。';history.replaceState(null,'',location.pathname+location.search);pass.focus()}
function decorate(){
 const sections=[...research.querySelectorAll('section.study[id]')];
 for(const sec of sections){const a=document.createElement('a');a.href='#'+sec.id;a.textContent=sec.dataset.nav||sec.querySelector('h2').textContent;nav.append(a)}
 const close=document.createElement('button');close.textContent='重新鎖定';close.addEventListener('click',lock);nav.append(close);
 for(const [i,table] of Array.from(research.querySelectorAll('.scan table')).entries()){
  const existing=table.parentElement.classList.contains('table-scroll');const wrap=existing?table.parentElement:document.createElement('div');wrap.className='table-scroll';wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label','可橫捲的理論數據表');
  if(!existing){table.before(wrap);wrap.append(table);}
  const tools=document.createElement('div');tools.className='table-tools';const btn=document.createElement('button');btn.textContent='下載此表 CSV';
  btn.addEventListener('click',()=>{
   const clean=t=>t.replace(/\s+/g,' ').trim();const quote=t=>'"'+clean(t).replaceAll('"','""')+'"';
   const data=Array.from(table.rows,tr=>Array.from(tr.cells,c=>quote(c.textContent)).join(',')).join('\r\n');
   const url=URL.createObjectURL(new Blob(['\ufeff',data],{type:'text/csv;charset=utf-8'}));
   const a=document.createElement('a');a.href=url;a.download='理論數據-'+(i+1)+'.csv';a.click();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
  });tools.append(btn);wrap.before(tools);
 }
}
form.addEventListener('submit',async event=>{
 event.preventDefault(); if(!window.crypto?.subtle){status.textContent='此頁需要安全連線（HTTPS）及支援 Web Crypto 的瀏覽器。';return}
 const submit=form.querySelector('[type=submit]');submit.disabled=true;status.textContent='正在解鎖…';
 try{
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass.value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(envelope.salt),iterations:envelope.iterations,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(envelope.iv)},key,bytes(envelope.ciphertext));
  research.innerHTML=new TextDecoder('utf-8',{fatal:true}).decode(plain);pass.value='';
  decorate();panel.hidden=true;nav.hidden=false;research.hidden=false;status.textContent='';
  if(location.hash){document.getElementById(location.hash.slice(1))?.scrollIntoView()}else{nav.querySelector('a')?.focus()}
 }catch(e){research.replaceChildren();nav.replaceChildren();status.textContent='共用碼不正確，或內容無法解鎖。';pass.select()}
 finally{submit.disabled=false}
});
</script>

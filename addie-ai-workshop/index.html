設計可區分原因的補測","只要求重新量到與理論一致","把數據交給 AI 自動重評"],0,"如果原因可能是零點偏移或讀值波動，就讓補測能區分兩者，回饋才會導向可執行的下一步。"]]]];

  c.beginPath();c.moveTo(x-16,y+14);c.lineTo(x-2,y-17);c.lineTo(x+15,y+14);c.closePath();c.fillStyle="#7fbfff70";c.fill();c.strokeStyle="#bce8ff";c.stroke();
  ["#ff9d9e","#ffd495","#a8e6a6","#a9d2fd","#d3acff"].forEach((v,i)=>line(c,[[x+5,y+2],[x+47,y-8+i*6]],v,2));
 }else if(index===3){
  for(let i=0;i<3;i++){const xx=x-29+i*27;
   rect(c,xx,y-19,15,32,"#182d38",4,color);rect(c,xx+2,y+4-i*5,11,7+i*5,["#96d5ae","#dcaa7e","#ed8e7b"][i],2);
   line(c,[[xx+15,y-4],[xx+18,y-4]],"#dfceb8",1);}
 }else if(index===4){
  for(let i=0;i<3;i++){const xx=x-34+i*29;rect(c,xx,y-12,23,28,["#e9e5d0","#b7c7ef","#d5b4d9"][i],2);
  for(let j=0;j<3;j++)line(c,[[xx+4,y-5+j*5],[xx+18,y-5+j*5]],"#606d89",1);}
 }else{
  rect(c,x-43,y-17,86,36,"#172a35",5,"#a79768");line(c,[[x-34,y-5],[x+32,y-5]],color,3);
  line(c,[[x-7,y+12],[x,y-4],[x+7,y+12],[x-7,y+12]],"#dcab80");
  [x-28,x+23].forEach(xx=>{line(c,[[xx,y-5],[xx,y+4]],color,1);rect(c,xx-5,y+4,10,8,"#ae7d68",2);});
 }
}
function drawRoom(r,i){
 const {x,y,color,floor}=r,w=264,h=200;
 rect(bg,x-3,y+9,w+6,h+4,"#0005",10);rect(bg,x,y,w,h,floor,8,"#78909b");
 bg.save();bg.beginPath();bg.roundRect(x,y,w,h,8);bg.clip();
 for(let iy=0;iy<h;iy+=20)for(let ix=0;ix<w;ix+=22){
  bg.fillStyle=(ix/22+iy/20)%2?"#d2ebe109":"#101a2221";bg.fillRect(x+ix,y+iy,21,19);
 }
 rect(bg,x,y,w,31,"#132735",0);rect(bg,x,y+28,w,4,color+"72");
 for(let j=0;j<8;j++)rect(bg,x+22+j*29,y+10,17,8,j%3===1?color+"a8":"#3f6070",2);
 glow(bg,x+w/2,y+90,105,color);
 rect(bg,x+65,y+57,134,57,"#101a25aa",9);rect(bg,x+65,y+51,134,55,"#4d656b",8,"#8ca4a2");rect(bg,x+70,y+56,124,43,"#293f4b",5,"#627b80");
 instrument(bg,i,x+132,y+77,color);
 shelf(bg,x+14,y+49,color);plant(bg,x+237,y+68);
 rect(bg,x+102,y+181,64,21,"#182e39",3);line(bg,[[x+103,y+184],[x+165,y+184]],color+"b0");
 line(bg,[[x+6,y+187],[x+99,y+187]],color+"65",2);line(bg,[[x+169,y+187],[x+258,y+187]],color+"65",2);
 for(let k=0;k<5;k++)rect(bg,x+13+k*13,y+181,5,10,color+"55",1);
 bg.restore();
 blocked.push({x:x+60,y:y+46,w:142,h:63},{x:x+9,y:y+45,w:45,h:46},{x:x+223,y:y+46,w:29,h:47});
}
function drawBackdrop(){
 const {width,height}=backdrop;
 const gradient=bg.createLinearGradient(0,0,width,height);
 gradient.addColorStop(0,"#203647");gradient.addColorStop(1,"#122633");bg.fillStyle=gradient;bg.fillRect(0,0,width,height);
 for(let y=0;y<height;y+=16)for(let x=0;x<width;x+=16){bg.fillStyle=(x/16+y/16)%2?"#d4f4e607":"#15273422";bg.fillRect(x,y,15,15);}
 rect(bg,18,230,924,68,"#243f4e",8,"#4b6771");
 for(let x=30;x<940;x+=26)line(bg,[[x,246],[x+10,246]],"#80a5ad88",2);
 line(bg,[[28,292],[930,292]],"#6b989c",2);
 rooms.forEach(drawRoom);
 for(const x of [9,948]){rect(bg,x,31,4,490,"#688a90",1);}
 [[21,264],[938,264],[324,273],[636,273],[21,540],[938,540]].forEach(([x,y])=>plant(bg,x,y));
 bg.font="600 13px system-ui";bg.textAlign="center";bg.fillStyle="#afd0d1";
 bg.fillText("中央走廊",480,291);bg.textAlign="left";
 bg.font="700 13px system-ui";bg.fillStyle="#9bbfc5";bg.fillText("入口",40,279);
}
function actor(c,x,y,color,facing=1,step=0,hero=false){
 oval(c,x,y+8,15,7,"#080f19a0");
 rect(c,x-9,y-1+step,7,11,"#162838",3);rect(c,x+2,y-1-step,7,11,"#162838",3);
 rect(c,x-12,y-13,24,17,hero?"#d8efe9":"#c8d6de",6,"#121f29");
 rect(c,x-8,y-11,16,12,color,4);rect(c,x-11,y-25,22,16,"#14252f",7);
 rect(c,x-8,y-23,16,13,hero?"#e1b49b":"#d6a78e",5);
 rect(c,x-9,y-25,18,6,hero?"#5b4a61":"#3c3b48",3);
 circle(c,x+3*facing,y-16,1.4,"#1a252c");
 rect(c,x-12,y-9,4,9,color,2);rect(c,x+8,y-9,4,9,color,2);
 if(hero){line(c,[[x-8,y-9],[x-5,y-6],[x-2,y-9]],"#f8fbf2",1);}
}
function drawFrame(now){
 ctx.drawImage(backdrop,0,0);
 const stamp=reduced?0:now;
 const actors=rooms.map((r,i)=>({x:r.nx,y:r.ny,r,i})).concat(player).sort((a,b)=>a.y-b.y);
 for(const a of actors){
  if(a===player){glow(ctx,a.x,a.y,28,"#c8fff0");actor(ctx,a.x,a.y,"#6ae0e3",a.facing,reduced?0:Math.sin(a.step)*2,true);continue;}
  const {r,i}=a;
  const radius=24+Math.sin(stamp/495+i)*3;
  glow(ctx,r.nx,r.ny,35,r.color);ctx.beginPath();ctx.ellipse(r.nx,r.ny+6,radius,10,0,0,7);
  ctx.strokeStyle=near===i?r.color:r.color+"70";ctx.lineWidth=near===i?2.5:1.5;ctx.stroke();
  actor(ctx,r.nx,r.ny,r.color);
  if(isComplete(i)){circle(ctx,r.nx+20,r.ny-23,7,r.color);line(ctx,[[r.nx+17,r.ny-23],[r.nx+19,r.ny-21],[r.nx+23,r.ny-25]],"#182b31",1.5);}
 }
}
drawBackdrop();
const map=document.querySelector("#map-view"), scene=document.querySelector("#scene"), list=document.querySelector("#station-list");
const dialog=document.querySelector("#mission"), content=document.querySelector("#mission-content"), interact=document.querySelector("#interact");
const utility=document.querySelector("#utility"), nearLabel=document.querySelector("#near-label");
const fields=[["course","課程／單元"],["goal","學生要學會什麼？"],["ai","AI 在哪一步介入？"],["evidence","要收哪一項學習證據？"],["verify","誰查核 AI 產出？怎麼查核？"]];
const key="addie-ai-science-v1";
let model={answers:stations.map(()=>[]),notes:{}}, canSave=true;
try{
 const saved=JSON.parse(localStorage.getItem(key));
 if(Array.isArray(saved?.answers)) model.answers=stations.map((s,i)=>(Array.isArray(saved.answers[i])?saved.answers[i]:[]).slice(0,s[4].length).filter(v=>Number.isInteger(v)&&v>=0&&v<=2));
 if(saved?.notes&&typeof saved.notes==="object")model.notes=saved.notes;
}catch{canSave=false;}
function persist(){try{localStorage.setItem(key,JSON.stringify(model));}catch{canSave=false;}}
const isComplete=i=>model.answers[i].length===stations[i][4].length;
const completed=()=>rooms.filter((_,i)=>isComplete(i)).length;
const status=i=>isComplete(i)?"已完成":model.answers[i].length?"進行中":"待探索";
const score=i=>model.answers[i].filter((v,j)=>v===stations[i][4][j][2]).length;
const button=(label,action,alt=false)=>'<button class="btn'+(alt?' alt':'')+'" data-action="'+action+'">'+label+'</button>';
const actions=buttons=>'<div class="actions">'+buttons+'</div>';
const icon=r=>'<span class="room-icon" aria-hidden="true">'+r.icon+'</span>';
const lines=[
 "這堂課需要每位學生都能比較葉片表皮。想想設備安排與學習證據怎麼一起規劃。",
 "這份報告有值得討論的推論，但也有學生資料。請權衡示範需要和資料揭露。",
 "光譜儀上的數值看起來很合理。你能用物理模型獨立驗證這個主張嗎？",
 "助教可以回答得很快。請安排介入時機，讓學生保留自己的預測和解釋。",
 "老師們正在共備同一份論證規準。請選一套能協助多位教師對齊判斷的流程。",
 "一組更接近理論、一組更能交代誤差。想想你真正要評量的探究能力。"
];
let view="map", near=-1, active=0, question=0, stage="intro", trigger=null;
const directions={ArrowLeft:"left",ArrowUp:"up",ArrowDown:"down",ArrowRight:"right",a:"left",w:"up",s:"down",d:"right"};
const held=new Set();
scene.insertAdjacentHTML("beforeend",rooms.map((r,i)=>'<button data-room="'+i+'" aria-label="'+r.name+'，'+stations[i][0]+'" style="--room:'+r.color+';left:'+((r.x+132)/9.6)+'%;top:'+((r.y+41)/5.6)+'%">'+(i+1)+' '+r.name+'</button>').join(""));
function refresh(){
 const done=completed();
 document.querySelector("#progress").value=done;
 document.querySelector("#progress-label").textContent=done+"／6 站完成";
 document.querySelector("#count-label").textContent=done+" 枚徽章";
 list.innerHTML=rooms.map((r,i)=>'<button class="station" style="--room:'+r.color+'" data-room="'+i+'">'+icon(r)+'<span><strong>'+r.name+'</strong><small>'+stations[i][0]+'</small></span><em>'+status(i)+'</em></button>').join("");
}
function updateNear(){
 const next=rooms.findIndex(r=>Math.hypot(player.x-r.nx,player.y-r.ny)<59);
 if(next===near)return;
 near=next;
 interact.disabled=near<0;
 nearLabel.textContent=near<0?"走近站長，或從手冊直接展開任務。":"已靠近"+rooms[near].host+"，可以交談。";
 scene.querySelectorAll("[data-room]").forEach((b,i)=>b.dataset.near=String(i===near));
}
function walkable(x,y){
 if(x<20||x>940||y<41||y>543)return false;
 return !blocked.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);
}
function move(dx,dy){
 const x=player.x+dx,y=player.y+dy;
 if(walkable(x,player.y))player.x=x;
 if(walkable(player.x,y))player.y=y;
 if(dx)player.facing=Math.sign(dx);
 player.step+=Math.hypot(dx,dy)*.33;
 updateNear();
}
let last=0;
function frame(now){
 const elapsed=Math.min(34,now-last||16);last=now;
 if(view==="map"&&!dialog.open){
  let x=Number(held.has("right"))-Number(held.has("left")),y=Number(held.has("down"))-Number(held.has("up"));
  if(x||y){const speed=.23*elapsed/Math.hypot(x,y);move(x*speed,y*speed);}
  drawFrame(now);
 }
 requestAnimationFrame(frame);
}
function openRoom(i,source){
 active=i;question=0;stage="intro";trigger=source||null;held.clear();
 renderMission();if(!dialog.open)dialog.showModal();content.querySelector("#mission-heading").focus();
}
function renderMission(){
 const r=rooms[active], [title,topic,scenario,principle,qs]=stations[active];
 dialog.style.setProperty("--room",r.color);
 let section='<div class="dialog-top">'+icon(r)+'<div><p class="kicker">'+r.host+' · '+title+'</p><h2 id="mission-heading" tabindex="-1">'+r.name+'</h2></div><button class="ghost" data-action="close" aria-label="關閉任務">✕</button></div>';
 if(stage==="intro"){
  section+='<p class="scenario">'+topic+'</p><p class="box">'+lines[active]+'</p>'+actions(button("繼續對話","brief")+button(isComplete(active)?"回顧作答":"接受任務","accept",true));
 }else if(stage==="brief"){
  section+='<h3 class="question">'+topic+'</h3><p class="box">'+scenario+'</p>'+actions(button(isComplete(active)?"回顧作答":"接受任務","accept")+button("返回對話","intro",true));
 }else if(stage==="finish"){
  section+='<p class="achievement">獲得「'+r.badge+'」徽章</p><p class="scenario">本站完成 · 首次作答 '+score(active)+'／'+qs.length+' 題正確</p><p class="box">'+principle+'</p>'+actions(button("返回探索地圖","close")+button("查看學習報表","showReport",true));
 }else{
  const [prompt,options,correct,reason]=qs[question], answer=model.answers[active][question];
  const answers=options.map((v,i)=>'<button class="choice" data-choice="'+i+'" '+(answer===undefined?"":"disabled")+' data-mark="'+(answer===undefined?"":i===correct?"correct":i===answer?"wrong":"")+'">'+String.fromCharCode(65+i)+'．'+v+'</button>').join("");
  section+='<p class="scenario">'+scenario+'</p><p class="kicker">第 '+(question+1)+'／'+qs.length+' 題</p><h3 id="prompt" tabindex="-1" class="question">'+prompt+'</h3><div class="stack">'+answers+'</div>';
  if(answer!==undefined)section+='<div class="feedback" id="feedback" tabindex="-1"><strong>'+(answer===correct?"答對了":"參考答案 "+String.fromCharCode(65+correct))+'</strong><p>'+reason+'</p></div>'+actions(button(question===qs.length-1?"完成本站":"下一題","next"));
 }
 content.innerHTML=section;
}
function missionStep(next,focus){
 stage=next;renderMission();(content.querySelector(focus)||content.querySelector("#mission-heading")).focus();
}
function openView(next,focus=true){
 view=next;held.clear();map.hidden=next!=="map";utility.hidden=next==="map";
 document.querySelectorAll("nav [data-view]").forEach(b=>{if(b.dataset.view===next)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
 if(next==="map"){if(focus)document.querySelector("[data-view=map]").focus();return;}
 if(next==="guide")utility.innerHTML='<h2 tabindex="-1">素養速查</h2><div class="stack">'+stations.map(([title,,,principle],i)=>'<details class="box"><summary>'+title+'</summary><p>'+principle+'</p>'+actions('<button class="btn alt" data-room="'+i+'">查看情境</button>')+'</details>').join("")+'</div>';
 if(next==="notes"){
  utility.innerHTML='<h2 tabindex="-1">行動筆記</h2><div class="stack"><p>用下面五個問題規劃一堂可試教的課。</p>'+fields.map(([id,label],i)=>'<div class="field"><label for="'+id+'">'+label+'</label>'+(i===0?'<input id="'+id+'" data-field="'+id+'">':'<textarea id="'+id+'" data-field="'+id+'"></textarea>')+'</div>').join("")+actions(button("下載行動筆記","downloadNotes"))+'<p class="muted" id="stored" role="status">'+(canSave?"筆記會保留在本瀏覽器。":"請下載筆記以保留內容。")+'</p></div>';
  utility.querySelectorAll("[data-field]").forEach(input=>input.value=model.notes[input.dataset.field]||"");
 }
 if(next==="report"){
  const headings=["站別","狀態","已答題數","答對題數","徽章"];
  utility.innerHTML='<h2 tabindex="-1">學習報表</h2><div class="table"><table><thead><tr>'+headings.map(v=>'<th scope="col">'+v+'</th>').join("")+'</tr></thead><tbody>'+reportRows().map(([name,...rest])=>'<tr><th scope="row">'+name+'</th>'+rest.map(v=>'<td>'+v+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'+actions(button("下載 CSV","downloadReport")+button("寫行動筆記","showNotes",true));
 }
 if(focus)utility.querySelector("h2").focus();
}
function reportRows(){return rooms.map((r,i)=>[r.name,status(i),model.answers[i].length+"／"+stations[i][4].length,score(i),isComplete(i)?r.badge:"—"]);}
function download(name,type,value){
 const url=URL.createObjectURL(new Blob(["\uFEFF",value],{type}));
 const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
document.addEventListener("click",event=>{
 const b=event.target.closest("button");if(!b||b.disabled)return;
 const {view:target,room,choice,action,dir}=b.dataset;
 if(target){openView(target);return;}
 if(room!==undefined){openRoom(Number(room),b);return;}
 if(b===interact&&near>=0){openRoom(near,b);return;}
 if(dir&&event.detail===0){const dx=dir==="left"?-15:dir==="right"?15:0,dy=dir==="up"?-15:dir==="down"?15:0;move(dx,dy);return;}
 if(choice!==undefined){
  if(model.answers[active][question]!==undefined)return;
  model.answers[active][question]=Number(choice);persist();refresh();missionStep("quiz","#feedback");return;
 }
 if(action==="close")dialog.close();
 else if(action==="intro"||action==="brief")missionStep(action,"#mission-heading");
 else if(action==="accept"){question=isComplete(active)?0:model.answers[active].length;missionStep("quiz","#prompt");}
 else if(action==="next"){question++;missionStep(question===stations[active][4].length?"finish":"quiz","#prompt");}
 else if(action==="showReport"){dialog.close();openView("report");}
 else if(action==="showNotes")openView("notes");
 else if(action==="downloadNotes")download("Addie_Lu_AI_行動筆記.txt","text/plain;charset=utf-8",fields.map(([id,label])=>label+"\r\n"+(model.notes[id]||"")).join("\r\n\r\n"));
 else if(action==="downloadReport")download("Addie_Lu_AI_研習報表.csv","text/csv;charset=utf-8",[["站別","狀態","已答題數","答對題數","徽章"],...reportRows()].map(r=>r.join(",")).join("\r\n"));
});
dialog.addEventListener("close",()=>{if(view==="map"){const target=trigger?.isConnected?trigger:list.querySelector('[data-room="'+active+'"]');target?.focus();}trigger=null;});
utility.addEventListener("input",event=>{const field=event.target.dataset.field;if(!field)return;model.notes[field]=event.target.value;persist();utility.querySelector("#stored").textContent=canSave?"已在本瀏覽器儲存。":"請下載筆記以保留內容。";});
window.addEventListener("keydown",event=>{
 if(dialog.open||view!=="map"||event.altKey||event.metaKey||event.ctrlKey)return;
 const k=event.key.length===1?event.key.toLowerCase():event.key;
 if(directions[k]){event.preventDefault();held.add(directions[k]);}
 if(k==="e"&&!event.repeat&&near>=0){event.preventDefault();openRoom(near,interact);}
});
window.addEventListener("keyup",event=>held.delete(directions[event.key.length===1?event.key.toLowerCase():event.key]));
window.addEventListener("blur",()=>held.clear());
document.querySelectorAll("[data-dir]").forEach(b=>{
 b.addEventListener("pointerdown",event=>{b.setPointerCapture(event.pointerId);held.add(b.dataset.dir);const v={left:[-9,0],right:[9,0],up:[0,-9],down:[0,9]}[b.dataset.dir];move(...v);});
 for(const event of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(event,()=>held.delete(b.dataset.dir));
});
refresh();drawFrame(0);requestAnimationFrame(frame);
</script></body></html>

<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2340" viewBox="0 0 1000 2340" role="img" aria-labelledby="poster-title"><title id="poster-title">附中國三第二次段考地科第5、6章十張重點圖解 GPT版</title><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#183842;font-size:18px}.sm{font-size:16px}</style><rect width="1000" height="2340" fill="#f8faf7"/><text x="42" y="58" style="font-size:34px;font-weight:bold">地科第5、6章・重點圖解｜GPT版</text><text x="42" y="96" style="font-size:21px">高師大附中115-1國三第二次段考・翰林版</text><text x="42" y="130" style="font-size:17px">示意圖非比例；完整解說、7題會考／基測詳解請見教學網頁。</text><g><rect x="40" y="170" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="58" y="202" style="font-size:22px;font-weight:bold">1｜水循環</text><svg x="60" y="225" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" role="img" aria-labelledby="water-title"><title id="water-title">水循環：海水蒸發、凝結成雲、降水、地表逕流與地下水回到海洋</title><defs><marker id="wa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#007e79"/></marker></defs><path d="M0 218 L100 218 L235 135 L400 205 L400 310 L0 310 Z" fill="#e9d7ac"/><rect x="0" y="225" width="112" height="85" fill="#b4dbe5"/><path d="M190 63 Q180 28 216 33 Q238 0 258 35 Q304 28 304 64 Z" fill="#d5e7eb"/><text x="247" y="90" text-anchor="middle">凝結成雲</text><path d="M56 213 Q20 83 171 57" fill="none" stroke="#007e79" stroke-width="3" marker-end="url(#wa)"/><text x="22" y="119">蒸發</text><path d="M235 99 L235 124" stroke="#007e79" stroke-width="3" marker-end="url(#wa)"/><text x="270" y="127">降水</text><path d="M222 158 L126 213" stroke="#007e79" stroke-width="3" marker-end="url(#wa)"/><text x="150" y="158">逕流</text><path d="M290 194 L290 243 L130 265" fill="none" stroke="#007e79" stroke-width="3" marker-end="url(#wa)"/><text x="300" y="230">入滲</text><text x="198" y="293" text-anchor="middle">地下水流向較低水頭處</text><text x="42" y="276">海洋</text></svg></g><g><rect x="520" y="170" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="538" y="202" style="font-size:22px;font-weight:bold">2｜地下水與抽水</text><svg x="540" y="225" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-labelledby="ground-title"><title id="ground-title">地下水位與抽水降落漏斗示意</title><rect x="10" y="70" width="380" height="190" fill="#eadbbb"/><path d="M10 135 L110 135 Q200 135 225 198 Q250 135 305 135 L390 135 L390 260 L10 260Z" fill="#a7d3de"/><path d="M10 135 L390 135" stroke="#345fa8" stroke-dasharray="6 5" stroke-width="2"/><path d="M10 135 L110 135 Q200 135 225 198 Q250 135 305 135 L390 135" fill="none" stroke="#007e79" stroke-width="3"/><rect x="216" y="37" width="18" height="210" fill="white" stroke="#183842" stroke-width="2"/><path d="M225 230 L225 30 L265 30" fill="none" stroke="#007e79" stroke-width="3"/><text x="273" y="37">抽水</text><text x="17" y="114">原地下水位</text><text x="17" y="183">岩粒孔隙中的水</text><text x="257" y="213">水位下降</text><text x="205" y="282" text-anchor="middle">過量抽水可能導致地層壓密下陷</text></svg></g><g><rect x="40" y="590" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="58" y="622" style="font-size:22px;font-weight:bold">3｜河川地表作用</text><svg x="60" y="645" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" role="img" aria-labelledby="river-title"><title id="river-title">河流從山區到出海口：上游侵蝕、下游沉積；平原蜿蜒河道外彎侵蝕與內彎沉積</title><path d="M15 146 L80 32 L145 146 L215 206 L390 206 L390 295 L15 295 Z" fill="#eadbbb"/><path d="M85 92 C140 143 120 188 201 209 S281 214 312 244" fill="none" stroke="#75b9cb" stroke-width="15"/><path d="M312 244 L365 276 L275 276 Z" fill="#d8c18e"/><path d="M312 244 L304 276 M312 244 L337 276" fill="none" stroke="#75b9cb" stroke-width="6"/><text x="166" y="56">山區：侵蝕較顯著</text><text x="236" y="153" text-anchor="middle">流速變慢</text><text x="247" y="182" text-anchor="middle">搬運能力減弱</text><text x="204" y="302" text-anchor="middle">河口：泥沙沉積，可形成三角洲</text></svg></g><g><rect x="520" y="590" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="538" y="622" style="font-size:22px;font-weight:bold">4｜三大岩類的轉變</text><svg x="540" y="645" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-labelledby="rock-title"><title id="rock-title">岩石轉變：岩漿冷卻成火成岩，碎屑壓密膠結成沉積岩，高溫高壓形成變質岩，岩石熔融可回到岩漿</title><defs><marker id="ra" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007e79"/></marker></defs><rect x="130" y="12" width="140" height="45" rx="6" fill="#f3c2a3"/><text x="200" y="42" text-anchor="middle">岩漿</text><rect x="15" y="141" width="140" height="48" rx="6" fill="#d6e5de"/><text x="85" y="173" text-anchor="middle">火成岩</text><rect x="245" y="141" width="140" height="48" rx="6" fill="#e6d8b6"/><text x="315" y="173" text-anchor="middle">沉積岩</text><rect x="130" y="276" width="140" height="48" rx="6" fill="#c4d6e8"/><text x="200" y="307" text-anchor="middle">變質岩</text><path d="M144 60L89 131 M158 165L232 165 M305 196L251 269 M150 272L95 196 M270 290Q395 48 278 35" fill="none" stroke="#007e79" stroke-width="2" marker-end="url(#ra)"/><text x="47" y="92">冷卻凝固</text><text x="200" y="123" text-anchor="middle" class="sm">風化侵蝕→沉積</text><text x="200" y="145" text-anchor="middle" class="sm">壓密、膠結</text><text x="50" y="239" class="sm">高溫高壓</text><text x="274" y="239" class="sm">高溫高壓</text><text x="324" y="76" class="sm">熔融</text></svg></g><g><rect x="40" y="1010" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="58" y="1042" style="font-size:22px;font-weight:bold">5｜地球構造與岩石圈</text><svg x="60" y="1065" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" role="img" aria-labelledby="earth-title"><title id="earth-title">地球內部的成分分層與力學分層：岩石圈含地殼及上部地函，位於軟流圈上方</title><text x="22" y="29">成分分層</text><text x="222" y="29">力學分層</text><rect x="20" y="49" width="150" height="38" fill="#d9bf8c"/><text x="95" y="75" text-anchor="middle">地殼</text><rect x="20" y="87" width="150" height="127" fill="#e6ad78"/><text x="95" y="160" text-anchor="middle">地函</text><rect x="20" y="214" width="150" height="48" fill="#e9cb74"/><text x="95" y="245" text-anchor="middle">外核：液態</text><rect x="20" y="262" width="150" height="42" fill="#cc9465"/><text x="95" y="290" text-anchor="middle">內核：固態</text><rect x="217" y="49" width="163" height="70" fill="#c2dbd4"/><text x="298" y="78" text-anchor="middle">岩石圈＝板塊</text><text x="298" y="105" text-anchor="middle" class="sm">地殼＋上部地函</text><rect x="217" y="119" width="163" height="94" fill="#e8bf92"/><text x="298" y="151" text-anchor="middle">軟流圈</text><text x="298" y="178" text-anchor="middle" class="sm">可緩慢塑性流動</text><text x="298" y="202" text-anchor="middle" class="sm">非整層熔融</text><path d="M170 87L217 87" stroke="#718b8c" stroke-dasharray="4 4"/><text x="296" y="260" text-anchor="middle" class="sm">示意圖非厚度比例</text></svg></g><g><rect x="520" y="1010" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="538" y="1042" style="font-size:22px;font-weight:bold">6｜張裂邊界</text><svg x="540" y="1065" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="張裂型板塊向兩側分離，中間岩漿上升形成新洋殼"><rect x="15" y="105" width="160" height="50" fill="#d0b78a"/><rect x="225" y="105" width="160" height="50" fill="#d0b78a"/><path d="M175 155L200 97L225 155Z" fill="#e58d60"/><path d="M150 67L70 67M70 67L87 57M70 67L87 77M250 67L330 67M330 67L313 57M330 67L313 77" fill="none" stroke="#007e79" stroke-width="4"/><text x="200" y="29" text-anchor="middle">張裂：彼此遠離</text><text x="200" y="195" text-anchor="middle">中洋脊 · 新洋殼 · 地震</text></svg></g><g><rect x="40" y="1430" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="58" y="1462" style="font-size:22px;font-weight:bold">7｜聚合邊界</text><svg x="60" y="1485" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="聚合型板塊彼此接近，一側隱沒，可能形成海溝及火山弧"><path d="M15 102H178L300 197L279 218L165 138H15Z" fill="#98bac6"/><path d="M207 102H385V144H263Z" fill="#d0b78a"/><path d="M274 102L295 58L318 102" fill="#bf8868"/><path d="M65 55H145M145 55L128 45M145 55L128 65M340 55H260M260 55L277 45M260 55L277 65" fill="none" stroke="#007e79" stroke-width="4"/><text x="200" y="29" text-anchor="middle">聚合：彼此接近</text><text x="70" y="188">海溝</text></svg></g><g><rect x="520" y="1430" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="538" y="1462" style="font-size:22px;font-weight:bold">8｜錯動邊界</text><svg x="540" y="1485" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="錯動型板塊沿交界水平相對滑動，常發生地震"><rect x="25" y="68" width="172" height="120" fill="#b7d0c1"/><rect x="203" y="68" width="172" height="120" fill="#d8bc91"/><path d="M200 60V198" stroke="#183842" stroke-dasharray="6 5" stroke-width="3"/><path d="M120 165V88M120 88L110 105M120 88L130 105M280 88V165M280 165L270 148M280 165L290 148" fill="none" stroke="#007e79" stroke-width="4"/><text x="200" y="29" text-anchor="middle">錯動：水平擦身而過</text><text x="200" y="220" text-anchor="middle">俯視圖 · 常見地震</text></svg></g><g><rect x="40" y="1850" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="58" y="1882" style="font-size:22px;font-weight:bold">9｜震源與震央</text><svg x="60" y="1905" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 295" role="img" aria-labelledby="quake-title"><title id="quake-title">地下震源與正上方地表震央，地震波從震源向外傳遞</title><rect x="15" y="86" width="370" height="190" fill="#e4d2ac"/><path d="M15 86H385" stroke="#365c5d" stroke-width="3"/><path d="M115 86L290 276" stroke="#8d6046" stroke-width="6"/><circle cx="222" cy="201" r="22" fill="none" stroke="#4a86a2"/><circle cx="222" cy="201" r="46" fill="none" stroke="#4a86a2"/><circle cx="222" cy="201" r="70" fill="none" stroke="#4a86a2"/><circle cx="222" cy="201" r="6" fill="#bc5127"/><path d="M222 86V195" stroke="#bc5127" stroke-dasharray="5 4" stroke-width="2"/><circle cx="222" cy="86" r="6" fill="#007e79"/><text x="222" y="57" text-anchor="middle">震央：震源正上方</text><text x="249" y="205">震源</text><text x="28" y="127">斷層面</text><text x="29" y="253">震波向外傳遞</text></svg></g><g><rect x="520" y="1850" width="440" height="395" rx="8" fill="white" stroke="#cbd9d8"/><text x="538" y="1882" style="font-size:22px;font-weight:bold">10｜地層年代判讀</text><svg x="540" y="1905" width="400" height="315" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="layer-title"><title id="layer-title">地層年代教學重繪：石灰岩、八百萬年前火山灰、頁岩、砂岩依序向上，六百萬年前岩脈切穿地層</title><rect x="25" y="55" width="235" height="55" fill="#dfc18b"/><rect x="25" y="110" width="235" height="58" fill="#b4d1d8"/><rect x="25" y="168" width="235" height="24" fill="#a8aaa0"/><rect x="25" y="192" width="235" height="81" fill="#efe4bb"/><path d="M150 273L173 220L147 173L162 127L148 75L169 75L184 128L171 173L196 220L173 273Z" fill="#765646"/><text x="36" y="86">砂岩</text><text x="36" y="144">頁岩</text><text x="274" y="185" class="sm">火山灰</text><text x="274" y="210" class="sm">800萬年前</text><path d="M262 180H271" stroke="#536b73"/><text x="36" y="239">石灰岩</text><text x="190" y="38" text-anchor="middle">未翻轉：上新下老</text><text x="150" y="301" text-anchor="middle">岩脈：600萬年前</text></svg></g><text x="40" y="2302" style="font-size:18px">完整教材：https://addielu-phy.github.io/earth-science-exam2-gpt/</text></svg>
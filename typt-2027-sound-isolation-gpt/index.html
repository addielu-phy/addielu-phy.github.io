byId('toggle').addEventListener('click',()=>{const show=passwordInput.type==='password';passwordInput.type=show?'text':'password';byId('toggle').setAttribute('aria-label',show?'隱藏密碼':'顯示密碼');byId('toggle').setAttribute('aria-pressed',String(show));byId('slash').style.display=show?'none':'';passwordInput.focus()});
form.addEventListener('submit',async e=>{e.preventDefault();if(!passwordInput.value)return;error.textContent='';passwordInput.removeAttribute('aria-invalid');unlockButton.disabled=true;unlockButton.textContent='解鎖中…';try{if(!window.crypto?.subtle)throw new Error('crypto_unavailable');const data=JSON.parse(byId('encrypted-data').textContent),base=await crypto.subtle.importKey('raw',new TextEncoder().encode(passwordInput.value),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unbase64(data.salt),iterations:data.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);let plaintext;try{plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:unbase64(data.iv)},key,unbase64(data.ciphertext))}catch{throw new Error('incorrect_password')}const frame=document.createElement('iframe');frame.className='viewer';frame.title='Sound isolation GPT 版互動研究教材';frame.setAttribute('sandbox','allow-scripts allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox');frame.srcdoc=new TextDecoder().decode(plaintext);byId('content').replaceChildren(frame);passwordInput.value='';passwordInput.type='password';byId('gate').hidden=true;byId('content').hidden=false;byId('lock').hidden=false;document.title='Sound isolation 聲音隔離研究室｜TYPT 2027 · GPT 版本';frame.focus();}catch(err){error.textContent=err.message==='incorrect_password'?'密碼不正確，請重新輸入。':'目前無法解鎖，請使用支援加密功能的瀏覽器並確認使用 HTTPS 網址。';passwordInput.setAttribute('aria-invalid','true');passwordInput.focus()}finally{unlockButton.disabled=false;unlockButton.textContent='解鎖'}});
byId('lock').addEventListener('click',()=>{byId('content').replaceChildren();byId('content').hidden=true;byId('lock').hidden=true;byId('gate').hidden=false;passwordInput.value='';passwordInput.type='password';byId('toggle').setAttribute('aria-label','顯示密碼');byId('toggle').setAttribute('aria-pressed','false');byId('slash').style.display='';error.textContent='';passwordInput.removeAttribute('aria-invalid');document.title='IYPT 2027 Sound isolation（GPT 版）｜密碼入口';passwordInput.focus()});
</script></body></html>

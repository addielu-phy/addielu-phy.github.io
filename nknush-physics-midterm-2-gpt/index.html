'use strict';
const items = [{"no": "01", "chapter": "2-1 慣性定律", "title": "合力為零與慣性", "level": "基礎", "year": "106", "num": "19", "answer": "A", "model": "inertia", "formula": "合力 ΣF＝0 時，加速度 a＝0。原本靜止就保持靜止，原本運動就維持等速度直線運動。質量越大，越不容易改變運動狀態。", "steps": ["先看物體原本靜止或運動。", "判斷所有外力加起來是否為零。", "合力為零時，沿用原本的速度大小與方向。"], "trap": "用「還在動」判成一定有順向合力。等速度運動和靜止都可以是合力為零。", "question": "雅婷主張靜止的物體在沒有外力時會一直靜止。怡君主張正在運動的物體若所受合力為零，便會一直作等速度運動。兩人的說法是否合理？", "choices": ["兩人均合理", "兩人均不合理", "只有雅婷合理", "只有怡君合理"], "solution": ["雅婷的情況沒有外力，所以 ΣF＝0，原速度為 0，之後仍為 0。", "怡君的情況也有 ΣF＝0，因此速度保持原值，方向也保持。兩個敘述都符合慣性定律，所以選 A。", "解題技巧　題目說「合力為零」時，可直接問自己「它起初的速度是多少？」"], "practice": "冰上滑車原本以 3 m/s 向東移動。接下來 4 s 內合力始終為零。4 s 後速度為何？這段時間向哪個方向移動幾公尺？", "practice_solution": ["4 s 後仍向東 3 m/s，向東移動 12 m。", "ΣF＝0，所以 a＝0、v＝3 m/s 向東。", "等速度位移＝速度×時間＝3×4＝12 m，方向向東。"], "table": [], "src": "https://cap.rcpet.edu.tw/exam/106/106exam.html"}, {"no": "02", "chapter": "2-3 作用力與反作用力／2-4 萬有引力", "title": "互相施力與引力比較", "level": "基礎", "year": "109", "num": "45", "answer": "B", "model": "gravity", "formula": "同一對物體互相施加的力大小相等、方向相反、作用在不同物體。球形天體外可用 F＝Gm₁m₂/r² 比較引力，r 為中心距離。", "steps": ["把力寫成「誰對誰」。", "交換施力者和受力者，找出反作用力。", "若換了比較對象，再檢查質量與距離。"], "trap": "把地球質量大解讀成地球施力較大。互相吸引的力一樣大，但兩者所受的加速度可以不同。", "question": "俊傑認為橡皮擦對宇宙中每個物體的引力都一樣大。美玲認為地球質量很大，因此地球吸引她的力遠大於她吸引地球的力。兩人的看法何者符合萬有引力定律？", "choices": ["兩人皆符合", "兩人皆不符合", "只有俊傑符合", "只有美玲符合"], "solution": ["固定橡皮擦的質量，若對象的質量相同、距離加倍，吸引力就變為原來的 1/2²＝1/4。俊傑的說法不成立。", "地球對美玲與美玲對地球的引力是同一對交互作用，大小相等、方向相反。美玲的說法也不成立，所以選 B。", "解題技巧　「同一對互相施力」用第三定律。比較「不同配對」的力，再用引力比例。"], "practice": "兩星球中心距離原為 r，互相吸引力大小皆為 80 N。若兩星球質量不變，中心距離改為 2r，各受多少引力？若甲質量是乙的 4 倍，誰的加速度較大？是幾倍？", "practice_solution": ["各受 20 N。乙的加速度是甲的 4 倍。", "F′＝80×(r/2r)²＝20 N，兩力沿連心線、方向相反。", "用 a＝F/m。兩者 F 一樣，故 a乙/a甲＝m甲/m乙＝4。"], "table": [], "src": "https://cap.rcpet.edu.tw/exam/109/109exam.html"}, {"no": "03", "chapter": "2-2 運動定律", "title": "用運動狀態反求合力", "level": "核心", "year": "108", "num": "46", "answer": "C", "model": "newton", "formula": "牛頓第二運動定律 ΣF＝ma。加速度方向與合力相同。以向右為正時，向左的力與加速度用負值表示。", "steps": ["先找受力物體及所選正方向。", "由靜止、等速度或題給大小找加速度。", "算 ΣF＝ma，最後辨別題目問大小還是方向。"], "trap": "圖上標出的兩個施力未必涵蓋所有水平力。桌面若有摩擦，只算兩箭頭之差可能出錯。", "question": "四個 2 kg 木塊各在不同的水平桌面上。表中列出兩個外加水平力與運動狀態。哪一個木塊所受合力的大小為 1 N？", "choices": ["甲", "乙", "丙", "丁"], "solution": ["甲靜止、乙向右等速度，兩者 a＝0，合力都是 0 N。", "丙的加速度向左，合力大小＝2×0.5＝1 N，方向向左。丁的合力大小＝2×1＝2 N，方向向右。故選 C。", "解題技巧　先用加速度算所有力的總效果。若要找摩擦力，再把各水平力列入同一式。"], "practice": "3 kg 的箱子在水平地面向右滑動。人向右推 12 N，地面對箱子的摩擦力為 6 N。箱子的水平合力與加速度各是多少？", "practice_solution": ["水平合力向右 6 N，加速度向右 2 m/s²。", "向右為正，ΣF水平＝12−6＝6 N。鉛直方向無加速度，重力與支持力互相平衡。", "a＝ΣF水平/m＝6÷3＝2 m/s²，正值表示向右。"], "table": [["物體", "外加左向力", "外加右向力", "運動狀態"], ["甲", "2 N", "1 N", "靜止"], ["乙", "1 N", "2 N", "向右作等速度運動"], ["丙", "3 N", "1 N", "向左的加速度為 0.5 m"], ["s²"], ["丁", "1 N", "3 N", "向右的加速度為 1 m"], ["s²"]], "src": "https://cap.rcpet.edu.tw/exam/108/108exam.html"}, {"no": "04", "chapter": "2-4 圓周運動與萬有引力", "title": "圓周位置與切線速度", "level": "核心", "year": "110", "num": "39", "answer": "D", "model": "circle", "formula": "等速率圓周運動的速度沿切線，合力指向圓心。轉過的圈數 n＝ft，f 為每秒圈數。速率不變時，速度方向仍持續改變。", "steps": ["由旋轉方向及起點定位。", "以 ft 算圈數，整圈可略去，只看未滿一圈的部分。", "沿旋轉方向畫切線，另用向內箭頭標合力。"], "trap": "把向圓心的箭頭當作速度，或以為整圈回到原位就代表速度為零。", "question": "阿峰用細繩牽引小球，手固定在圓心。球在水平面每秒轉 2 圈，從圓心正東方出發。由上俯看為逆時針旋轉。3 s 時，小球的速度指向何方？", "choices": ["正東方", "正西方", "正南方", "正北方"], "solution": ["3 s 轉過 n＝2×3＝6 圈，所以球在圓心正東。", "逆時針從東經北往西，東側當下的切線朝北。小球的瞬時速度向北，所以選 D。", "同一瞬間，圓心在球的西方，水平向心合力向西。用垂直的兩箭頭區分速度與合力。"], "practice": "小球從圓心正東方出發，以每秒 1 圈順時針旋轉。經 0.25 s 後剪斷細繩。剪斷前球在哪一側？它的速度朝哪裡？若剪斷後水平合力為零，球接著如何移動？", "practice_solution": ["球在正南側，速度向西。剪斷後沿向西的切線等速度直線前進。", "n＝1×0.25＝1/4 圈，順時針由東轉到南。", "南側的順時針切線向西，剪斷瞬間速度連續。水平合力為零後，水平速度保持不變。"], "table": [], "src": "https://cap.rcpet.edu.tw/exam/110/110exam.html"}, {"no": "05", "chapter": "2-5 力矩與槓桿原理", "title": "力臂、合力矩與平衡", "level": "核心", "year": "111", "num": "33", "answer": "A", "model": "torque", "formula": "力矩大小 τ＝F×d⊥。力臂 d⊥ 是轉軸到力的作用線的垂直距離。若選順時針為正，逆時針為負。轉動平衡時合力矩為零。", "steps": ["先圈出轉軸，畫出施力的作用線。", "用垂直距離算每個力的力矩。", "先標旋轉方向，再做帶正負的加總。"], "trap": "兩力方向相反，產生的轉動方向仍可能相同。力矩用 N·m，功用 J。", "question": "第一根槓桿在中央有轉軸 O₁，軸左、右各 20 cm 處各施一個大小為 F 的垂直力，左側向上、右側向下，合力矩大小為 L₁。第二根槓桿的轉軸 O₂ 在左端，右側 40 cm 處受大小為 F 的向下垂直力，力矩大小為 L₂。兩者關係為何？", "choices": ["L₁＝L₂", "L₁＝2L₂", "2L₁＝L₂", "L₁＝0，且 L₁＜L₂"], "solution": ["左上和右下兩力都使第一根桿順時針轉。取順時針為正，L₁＝F×0.20＋F×0.20＝0.40F。", "第二根桿的力使桿順時針轉，L₂＝F×0.40＝0.40F。F 以 N 代入時，兩個結果都是 N·m，故選 A。", "解題技巧　把鉛筆中央當轉軸，用手比兩端的推力方向，再決定力矩加減。"], "practice": "水平輕桿的左側 30 cm 處受向下 12 N。要讓桿保持水平，右側距軸 45 cm 處應垂直施力多少、朝哪個方向？忽略桿重。", "practice_solution": ["右側向下施 8 N。", "左側向下使桿逆時針轉。右側要產生順時針轉動，所以力也向下。", "平衡時 12×0.30＝F×0.45，因此 F＝3.6÷0.45＝8 N。"], "table": [], "src": "https://cap.rcpet.edu.tw/exam/111/111exam.html"}, {"no": "06", "chapter": "3-2 動能與位能", "title": "質量、速率與高度的倍率", "level": "核心", "year": "105", "num": "42", "answer": "D", "model": "fall", "formula": "動能 K＝½mv²。近地面重力位能 U＝mgh，h 從同一基準面量起。彈性物體在彈性限度內，變形越大通常儲存越多彈力位能。", "steps": ["列出比較對象的質量、速率與高度。", "兩物自由落下時，用相同的 g 比較同一時刻的速率與高度。", "用公式逐項做倍率，尤其留意速率要平方。"], "trap": "同高且同速不保證能量相等。速率加倍且質量固定時，動能變為 4 倍。", "question": "甲、乙兩金屬球分別為 10 kg、5 kg，由同一高度同時從靜止自由落下。經 2 s 兩球都未落地。以地面為零位能面並忽略空氣阻力，此刻甲、乙的動能 K 與重力位能 U 該如何比較？", "choices": ["K甲＝K乙，U甲＝U乙", "K甲＞K乙，U甲＜U乙", "K甲＞K乙，U甲＝U乙", "K甲＞K乙，U甲＞U乙"], "solution": ["兩球皆由靜止出發，且加速度同為 g，因此 2 s 後的速率相同，下降的距離也相同。", "K甲/K乙＝(½×10×v²)/(½×5×v²)＝2。兩球在同一正高度，U甲/U乙＝(10×g×h)/(5×g×h)＝2。故選 D。", "解題技巧　先劃掉共同的 v² 和 gh。題目沒有給初始高度，仍能比較位能倍率。"], "practice": "甲為 2 kg、速率 6 m/s、高 1 m，乙為 4 kg、速率 3 m/s、高 2 m。取地面為零位能面，g＝10 m/s²。分別求兩者的動能和重力位能。", "practice_solution": ["甲 K＝36 J、U＝20 J，乙 K＝18 J、U＝80 J。", "甲 K＝½×2×6²＝36 J，U＝2×10×1＝20 J。", "乙 K＝½×4×3²＝18 J，U＝4×10×2＝80 J。"], "table": [], "src": "https://cap.rcpet.edu.tw/exam/105/105exam.html"}, {"no": "07", "chapter": "3-1 功與功率／3-2 動能與位能", "title": "正功、負功與動能改變", "level": "進階", "year": "113", "num": "38", "answer": "D", "model": "work", "formula": "定力與位移同向時 W＝Fs，反向時 W＝−Fs，垂直或位移為零時 W＝0。所有力所作的總功等於動能變化 ΔK。", "steps": ["先找題目問哪個力，並畫出位移方向。", "比較力和位移的方向，逐一寫出功的正負。", "題目問動能變化時，將各力作的功相加。"], "trap": "只看到施力就算正功。也別把「合功等於動能改變」套到單一個力。", "question": "無摩擦的水平面上，一個質量 M 的木塊由靜止出發，受水平定力 F 推進距離 S，作功全轉成動能。為讓最後的動能變成 2 倍，小明主張只把質量改為 2M，小華主張只把質量改為 M/2。兩人都保持 F 與 S 不變。誰的策略合理？", "choices": ["兩人皆合理", "只有小明合理", "只有小華合理", "兩人皆不合理"], "solution": ["初動能為 0。重力與支持力都垂直位移，作功為 0。合功只有水平推力的 FS，所以末動能 K＝FS。", "兩種策略的 F 和 S 都不變，因此各自的 K 都仍是 FS，所以選 D。", "解題技巧　質量會影響加速度和末速率。這題控制的是相同作用力與位移，直接比較合功最省步驟。"], "practice": "3 kg 箱子由靜止出發，在水平地面向右移動 5 m。推力向右 14 N，摩擦力向左 8 N。求推力的功、摩擦力的功和最後動能。", "practice_solution": ["推力作 70 J，摩擦力作 −40 J，末動能 30 J。", "W推＝14×5＝70 J，W摩＝−8×5＝−40 J。鉛直兩力各作 0 J。", "W合＝70−40＝30 J。箱子初動能為 0，故 K末＝0＋30＝30 J。"], "table": [], "src": "https://cap.rcpet.edu.tw/exam/113/113exam.html"}, {"no": "08", "chapter": "3-3 能量守恆定律與能源", "title": "力學能守恆與熱能轉換", "level": "進階", "year": "110", "num": "27", "answer": "D", "model": "pendulum", "formula": "力學能＝動能＋位能。只有重力或理想彈力作功時，力學能守恆。有摩擦時，若將物體與環境納入且無能量輸入輸出，減少的力學能會轉成內能等其他形式，總能量守恆。", "steps": ["選同一重力位能基準，標記各點高度和速率。", "先確認能否用 K初＋U初＝K末＋U末。", "有摩擦耗散時，改列轉換的能量並檢查單位。"], "trap": "把「總能量守恆」直接當成「動能加位能永遠不變」。轉折點速度瞬間為零，最低點速度通常最大。", "question": "單擺從左側甲點靜止釋放，經過最低點乙，再到達與甲同高的右側丙點。三點的重力位能記作 U，動能記作 E，分別以甲、乙、丙標示。忽略任何摩擦，下列何式正確？", "choices": ["U甲−U乙＝2E丙", "U乙−U丙＝2E甲", "U甲−U乙＝E甲−E乙", "U丙−U甲＝E甲−E丙"], "solution": ["沿途拉力垂直於瞬時速度，沒有作功。力學能固定，所以 U甲＋E甲＝U丙＋E丙，移項即為 D。", "甲、丙同高，U丙−U甲＝0。因 E甲＝0，E丙也為 0。乙較低，E乙＝U甲−U乙＞0。 A、B 將非零量與零相等，C 則把乙點動能的正負寫反。", "解題技巧　「位能減少量」等於「動能增加量」，先寫等式再移項。"], "practice": "質量 0.5 kg 的擺錘由比最低點高 0.8 m 處從靜止釋放。到最低點前有 1 J 的力學能轉為內能。取 g＝10 m/s²。最低點的動能和速率為多少？", "practice_solution": ["最低點動能為 3 J，速率為 √12 m/s，約 3.46 m/s。", "最低點取 U＝0。K初＝0，U初＝0.5×10×0.8＝4 J。", "K末＝4−1＝3 J。由 ½×0.5×v²＝3，得 v²＝12，取正根。"], "table": [], "src": "https://cap.rcpet.edu.tw/exam/110/110exam.html"}, {"no": "09", "chapter": "3-1 功與功率／3-3 能源", "title": "平均功率與能量取得比例", "level": "進階", "year": "112", "num": "45", "answer": "C", "model": "power", "formula": "平均功率 P＝W/t。1 W＝1 J/s。相同時間內，取得的能量比例等於取得的平均功率除以原始平均功率。", "steps": ["找出功或能量及其所對應的時間。", "秒、分鐘先換成一致單位，再算 P＝W/t。", "算比例前確認分子分母對應同一段時間。"], "trap": "功率大只表示單位時間內轉換的能量較多。時間不同時，還要乘上時間才能比較能量。", "question": "風力發電時，葉片從風中取得部分能量。題組定義功率係數 Cₚ 為「葉片取得的功率 ÷ 通過發電機前風力原始功率」。下列敘述何者合理？", "choices": ["葉片轉得越快，Cₚ 越大", "葉片轉得越快，Cₚ 越小", "葉片取得的風能比例越高，Cₚ 越大", "葉片取得的風能比例越高，Cₚ 越小"], "solution": ["同一段時間 t，若葉片取得 E取、風原有 E原，則 Cₚ＝(E取/t)÷(E原/t)＝E取/E原。", "因此取得的能量比例越高，Cₚ 就越大，選 C。光知道葉片轉速，還不能由題給定義判斷取得比例。", "解題技巧　看到兩個平均功率相除，先確認取樣時間相同，才能約掉時間。"], "practice": "一段時間內，來風平均提供 200 W，葉片以 40% 的比例取得能量，情況維持 30 s。求葉片平均取得的功率及這段時間取得的能量。", "practice_solution": ["80 W、2,400 J。", "P取＝0.40×200＝80 W。", "E取＝P取×t＝80×30＝2,400 J。也可先算風原有 6,000 J，再取 40%。"], "table": [], "src": "https://cap.rcpet.edu.tw/exam/112/112exam.html"}, {"no": "10", "chapter": "3-3 能量守恆定律與能源", "title": "發電組合與加權碳排", "level": "綜合", "year": "111", "num": "27", "answer": "B", "model": "energy", "formula": "每度電平均碳排＝各發電方式的「發電占比×每度電碳排」加總。風力、太陽能、水力屬再生能源。煤、天然氣與核燃料屬非再生能源。", "steps": ["讀取各能源的比例，先把百分率換成小數。", "比例乘上該來源的每度電碳排，再加總。", "比較同一國改變前後，或直接加總各來源的碳排變化。"], "trap": "「再生能源」按能否持續補充分類。題中把核能每度電碳排近似為零，仍屬非再生能源。", "question": "甲、乙兩國將調整發電配比。表中把原題圖的資訊整理成比例變化。每度電碳排取燃煤約 790 g、燃氣約 380 g，核能與再生能源皆接近 0。若只改變發電占比，2030 年相較 2015 年，兩國平均每度電碳排如何變動？", "choices": ["兩國都增加", "兩國都減少", "甲國增加，乙國減少", "甲國減少，乙國增加"], "solution": ["甲國煤減少 8 個百分點，氣減少 17 個百分點。每度電變化約為 (−0.08)×790＋(−0.17)×380＝−63.2−64.6＝−127.8 g。", "乙國煤減少 15 個百分點，氣增加 15 個百分點。變化約為 (−0.15)×790＋0.15×380＝−118.5＋57＝−61.5 g。", "兩國結果都是負值，所以選 B。乙國以等占比的燃氣替代燃煤，可直接算 0.15×(380−790)。"], "practice": "某地的發電原為煤 50%、氣 30%、風 20%，之後改為煤 30%、氣 30%、風 40%。沿用上題碳排係數，求改變前後的平均每度電碳排，並指出哪一項為再生能源。", "practice_solution": ["由約 509 g/度降到約 351 g/度，減少約 158 g/度。風力是再生能源。", "原來 0.50×790＋0.30×380＋0.20×0＝395＋114＝509。", "後來 0.30×790＋0.30×380＋0.40×0＝237＋114＝351。兩者相減 509−351＝158 g/度。"], "table": [["國別", "燃煤發電占比", "燃氣占比變化", "核能＋再生能源占比變化"], ["甲", "33% → 25%", "減少 17 個百分點", "增加 25 個百分點"], ["乙", "47% → 32%", "增加 15 個百分點", "不變"]], "src": "https://cap.rcpet.edu.tw/exam/111/111exam.html"}];

   bar(342,48,'動能',K,total,blue);bar(342,98,'重力位能',U,total,orange);
   bar(342,148,'轉成內能',loss,total,pink);bar(342,198,'總能量',total,total,ne);
   return 'K＝'+fmt(K)+' J｜U＝'+fmt(U)+' J｜轉成內能 '+fmt(loss)+' J｜速率 '+fmt(Math.sqrt(2*K/mass))+' m/s';
 },
 power([P,ratio,T],p){
   const t=T*p,E=P*t,K=E*ratio/100,cx=140,cy=112;
   line(cx,cy,cx,221,dim,7);
   for(let i=0;i<3;i++){
     const a=2*Math.PI*(p*3+i/3);
     line(cx,cy,cx+54*Math.cos(a),cy+54*Math.sin(a),ne,8);
   }
   ball(cx,cy,8,ne);
   for(let i=0;i<5;i++){
     const k=(i*27+p*120)%132;
     arrow(10+k,52+(i%2)*20,34+k,52+(i%2)*20,blue);
   }
   bar(299,73,'風原有的能量',E,P*T,blue);
   bar(299,129,'葉片取得的能量',K,P*T,ne);
   text('取得功率 '+fmt(P*ratio/100)+' W',299,205,orange,18);
   return 't＝'+fmt(t)+' s｜取得功率＝'+fmt(P*ratio/100)+' W｜葉片取得 '+fmt(K)+' J';
 },
 energy(v,p,m){
   const coal=[790,380].map((x,i)=>m?x:v[i+1]);
   let base,now,gas,adjustment;
   if(m){base=v[0];now=base+(v[1]-base)*p;gas=30;adjustment=0;}
   else{base=v[0]===0?33:47;now=base+(v[0]===0?-8:-15)*p;gas=0;adjustment=(v[0]===0?-17:15)*p;}
   const end=(now*coal[0]+gas*coal[1])/100,delta=((now-base)*coal[0]+adjustment*coal[1])/100;
   bar(40,61,'原燃煤占比',base,100,orange,'% ',225);
   bar(40,117,'當前燃煤占比',now,100,orange,'% ',225);
   if(m){
     bar(331,61,'燃氣占比',gas,100,blue,'%',225);
     bar(331,117,'風力占比',100-now-gas,100,ne,'%',225);
     text('平均每度電碳排 '+fmt(end)+' g',40,219,ne,23);
     return '燃煤 '+fmt(now)+'%｜燃氣 '+fmt(gas)+'%｜風力 '+fmt(100-now-gas)+'%｜約 '+fmt(end)+' g/度';
   }
   bar(331,117,'燃氣占比變化',adjustment,20,blue,'百分點',225);
   text('每度電碳排變化 '+fmt(delta)+' g',40,219,ne,23);
   return (v[0]===0?'甲國':'乙國')+'｜煤 '+fmt(now-base)+' 個百分點｜氣 '+fmt(adjustment)+' 個百分點｜'+fmt(delta)+' g/度';
 }
};
function draw(){
  ctx.clearRect(0,0,620,280);
  for(let x=20;x<620;x+=25) for(let y=20;y<280;y+=25)ball(x,y,1,'#20314b');
  $('#time').value=Math.round(progress*1000);
  $('#status').textContent=scenarios[items[index].model](values,progress,mode);
}
addEventListener('hashchange',routes);
routes();
</script>
